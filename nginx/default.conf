map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 497 is plain HTTP sent to this TLS port; WEB_PORT can only serve one of the two
    error_page 497 =307 https://$http_host$request_uri;

    client_max_body_size 10m;

    # Docker's DNS, re-resolved so a recreated web container doesn't leave a stale address
    resolver 127.0.0.11 valid=10s;
    set $web_upstream http://web:3000;

    # Server Components and SSE both stream, so nothing is held back here
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replaced, never appended: the API rate-limits on the first hop, which a client could otherwise forge
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass $web_upstream;
    }

    location ~ ^/(api/stream/|ws/) {
        proxy_pass $web_upstream;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
