[project]
name = "api"
version = "2.0.0"

description = "backend api for crabfarm made from fastAPI"
authors = [
    {name = "Art Lisboa",email = "lisboamillen30@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "sqlmodel (>=0.0.48,<0.0.49)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "aio-pika (>=10.2.3,<11.0.0) ; python_version >= \"3.12\" and python_version < \"4\"",
    "torch (>=2.15.0,<3.0.0) ; python_version >= \"3.12\" and python_full_version != \"3.14.1\"",
    "torchvision (>=0.29.2,<0.30.0) ; python_version >= \"3.12\" and python_full_version != \"3.14.1\"",
    "ultralytics (>=8.4.215,<9.0.0) ; python_version >= \"3.12\" and python_full_version != \"3.14.1\"",
    "websockets (>=17.4,<18.0) ; python_version >= \"3.12\" and python_full_version != \"3.14.1\""
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu", python = ">=3.12,<3.14.1 || >3.14.1"}
torchvision = {source = "pytorch-cpu", python = ">=3.12,<3.14.1 || >3.14.1"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "watchfiles (>=1.3.0,<2.0.0)"
]
