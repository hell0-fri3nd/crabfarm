[project]
name = "api"
version = "2.0.0"

description = "backend api for crabfarm made from fastAPI"
authors = [
    {name = "Art Lisboa",email = "lisboamillen30@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "sqlmodel (>=0.0.48,<0.0.49)",
    "psycopg[binary] (>=3.3.6,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
