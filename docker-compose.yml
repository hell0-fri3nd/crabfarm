name: crabfarm

x-api-service: &api-service
  image: crabfarm-api
  build: ./api
  env_file: .env
  environment: &api-environment
    DATABASE_URI: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgre_db:5432/${DB_NAME}
    RABBITMQ_ENABLED: "true"
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    DETECTION_ALLOWED_ORIGINS: '["${WEB_ORIGIN:-https://localhost}"]'

services:

  migrate:
    <<: *api-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgre_db:
        condition: service_healthy

  api:
    <<: *api-service
    restart: unless-stopped
    volumes:
      - ml_models:/srv/api/ml/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first start downloads the YOLO weights
      start_period: 120s

  worker:
    <<: *api-service
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  web:
    image: crabfarm-web
    build:
      context: ./web
      args:
        API_URL: http://api:8000
        API_PREFIX: ${API_PREFIX:-/api/v1}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_PATH: ${COOKIE_PATH:-/}
      ACCESS_COOKIE_SAMESITE: ${ACCESS_COOKIE_SAMESITE:-lax}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-strict}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-1}
      JWT_REFRESH_TOKEN_REMEMBER_ME_DAYS: ${JWT_REFRESH_TOKEN_REMEMBER_ME_DAYS:-7}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: crabfarm-nginx
    build: ./nginx
    restart: unless-stopped
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
    ports:
      - "${WEB_PORT:-443}:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy

  postgre_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "4627:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-server
    hostname: my-rabbitmq
    ports:
      - "5672:5672"     # STANDARD AMQP PORT
      - "15672:15672"   # MANAGEMENT CONSOLE PORT
      - "1883:1883"     # MQTT PORT (ESP32 devices)
      - "15692:15692"   # PROMETHEUS METRICS PORT (/metrics)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq_mqtt
        target: /etc/rabbitmq/conf.d/20-mqtt.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

configs:
  rabbitmq_plugins:
    content: |
      [rabbitmq_management,rabbitmq_prometheus,rabbitmq_mqtt].
  rabbitmq_mqtt:
    # ESP32 devices: MQTT on 1883 into amq.topic on vhost "/", so topic farm/{device_id}/sensors/{type}
    # arrives as routing key farm.{device_id}.sensors.{type} (api/context/01-architecture.md, broker topology)
    content: |
      mqtt.listeners.tcp.default = 1883
      mqtt.vhost = /
      mqtt.exchange = amq.topic
      mqtt.allow_anonymous = false
      mqtt.max_session_expiry_interval_seconds = 86400

volumes:
  db_data:
    driver: local
  rabbitmq_data:
    driver: local
  ml_models:
    driver: local
  nginx_certs:
    driver: local